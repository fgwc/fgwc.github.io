<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Fangwei Chang — Academic Portfolio</title>

<style>
  :root {
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: "Charter", "Georgia", "Times New Roman", serif;
  }

  [data-theme="dark"] {
    --bg: #1f1b19;
    --bg-panel: #292421;
    --nav-bg: rgba(31, 27, 25, 0.95);
    --border: #3d3531;
    --text: #d4cec9;
    --text-muted: #9e938e;
    --heading-color: #f2ebe6;
    --accent: #d98253;
    --accent-dim: #8c5335;
  }

  [data-theme="light"] {
    --bg: #fbf9f6;
    --bg-panel: #f2efe9;
    --nav-bg: rgba(251, 249, 246, 0.95);
    --border: #dfd8d1;
    --text: #3d3734;
    --text-muted: #756a65;
    --heading-color: #1a1715;
    --accent: #c45d29;
    --accent-dim: #e3a98c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  code, .mono, nav a {
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-serif);
    font-weight: 400;
    color: var(--heading-color);
    transition: color 0.2s ease;
  }

  a { color: var(--accent); text-decoration: none; transition: color 0.15s ease; }
  a:hover, a:focus-visible { text-decoration: underline; }
  ::selection { background: var(--accent-dim); color: #fff; }

  .wrap { max-width: 950px; margin: 0 auto; padding: 0 1.25rem; }

  nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--nav-bg); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  nav .wrap {
    display: flex; justify-content: space-between; align-items: center;
    height: 3rem; font-size: 0.8rem; overflow-x: auto;
  }

  nav .brand {
    color: var(--heading-color); font-family: var(--font-serif);
    font-size: 1.1rem; margin-right: 1.5rem; font-weight: 600; font-style: normal;
  }

  nav .links { display: flex; gap: 1rem; white-space: nowrap; align-items: center; }
  nav .links a { color: var(--text-muted); }
  nav .links a:hover { color: var(--accent); }

  .btn-toggle {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.25rem 0.6rem;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .btn-toggle svg { width: 14px; height: 14px; }

  section {
    padding: 2.5rem 0;
    border-bottom: 1px solid var(--border);
    transition: border-color 0.2s ease;
  }
  section:last-of-type { border-bottom: none; }

  h1 { font-size: 2.2rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.45rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }

  .fade-up { opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .fade-up.in { opacity: 1; transform: translateY(0); }

  /* About Info Formatting & Two-Column Widget Layout */
  .about-grid { display: grid; grid-template-columns: 1fr 380px; gap: 3rem; align-items: center; }
  .about-widget-col iframe { width: 100%; height: 480px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-panel); overflow: hidden; }

  @media (max-width: 768px) {
    .about-grid { grid-template-columns: 1fr; gap: 2rem; }
    .about-widget-col iframe { height: 440px; }
  }

  .contact-inline {
    display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
    margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem;
  }
  .contact-inline a, .secure-link { display: inline-flex; align-items: center; color: var(--accent); cursor: pointer; transition: color 0.15s ease; }
  .contact-inline a:hover, .secure-link:hover { color: var(--heading-color); text-decoration: underline; }
  .contact-sep { color: var(--text-muted); user-select: none; }
  .about-content { font-size: 1.08rem; line-height: 1.6; max-width: 75ch; color: var(--text); }

  /* Footer Contact Formatting */
  .contact-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .contact-list .k { color: var(--text-muted); display: inline-block; width: 6rem; }

  /* General Timeline and Entries */
  .timeline { margin-top: 0.5rem; border-left: 1px solid var(--border); padding-left: 1.25rem; }
  .timeline-item { position: relative; margin-bottom: 1.75rem; }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-item::before {
    content: ""; position: absolute; left: -1.5rem; top: 0.5rem;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent);
  }

  .timeline-item .meta {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    margin-bottom: 0.25rem; font-family: var(--font-main); flex-wrap: nowrap;
  }
  .timeline-item .meta .org {
    font-weight: 600; color: var(--heading-color); font-size: 1.1rem; flex: 1 1 auto; word-break: break-word; line-height: 1.3;
  }
  .timeline-item .meta .date {
    flex: 0 0 auto; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; color: var(--accent); white-space: nowrap; text-align: right;
  }

  .timeline-item h3 { font-size: 1.05rem; font-weight: 500; margin-bottom: 0.15rem; color: var(--text); }
  .timeline-item h4 { font-size: 0.9rem; font-weight: 400; font-style: italic; color: var(--text-muted); margin-bottom: 0.5rem; }

  /* Bulleted format for all entry descriptions */
  .timeline-item p, .cv-bullets li {
    display: list-item;
    list-style-type: disc;
    margin-left: 1.25rem;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  .timeline-item p:last-child, .cv-bullets li:last-child { margin-bottom: 0; }
  .cv-bullets { margin: 0; padding: 0; }

  /* Expandable sections */
  .hidden-item { display: none !important; }
  .timeline-item.revealed { display: block !important; }
  .card.revealed { display: flex !important; }

  .timeline-controls {
    margin-top: 1.25rem;
  }
  .expand-btn {
    font-family: var(--font-main);
    font-size: 0.85rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--accent);
    color: var(--heading-color);
    background: var(--bg-panel);
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .expand-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* Skills Block - Compact Dictionary Layout */
  .skills-compact { display: flex; flex-direction: column; gap: 0.85rem; }
  .skill-row { display: flex; align-items: baseline; line-height: 1.5; }
  .skill-cat { flex: 0 0 200px; font-weight: 600; color: var(--heading-color); font-size: 0.95rem; }
  .skill-items { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tech-tag {
    background: var(--bg-panel); border: 1px solid var(--border);
    padding: 0.15rem 0.4rem; border-radius: 3px; color: var(--text);
    font-family: var(--font-mono); font-size: 0.82rem; display: inline-block;
    transition: border-color 0.15s ease;
    cursor: default;
  }
  .tech-tag:hover {
    border-color: var(--text-muted);
  }

  @media (max-width: 600px) {
    .skill-row { flex-direction: column; gap: 0.4rem; }
    .skill-cat { flex: 0 0 auto; }
  }

  /* Projects Grid */
  .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(2, 1fr); margin-top: 0.5rem; }
  @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem;
    transition: border-color 0.15s ease; display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--text-muted); }
  .card .year { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); margin-bottom: 0.35rem; }
  .card h3 { font-size: 1.05rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--heading-color); }
  .card p { color: var(--text); font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1; display: block; list-style-type: none; margin-left: 0; }
  .card .links { font-family: var(--font-mono); font-size: 0.85rem; }

  /* Personal Block Aesthetic List */
  .personal-list { list-style: none; padding: 0; margin: 0; }
  .personal-list li { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; color: var(--text); font-size: 0.95rem; }
  .personal-list li::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--accent); }

  footer { padding: 3rem 0; border-top: 1px solid var(--border); background: var(--bg-panel); }
  footer .fine { margin-top: 2rem; color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
<script src="data.js?v=12"></script>
</head>
<body>

<nav>
  <div class="wrap">
    <span class="brand" id="nav-name"></span>
    <div class="links">
      <a href="#about">About</a>
      <a href="#education">Education</a>
      <a href="#experience">Experience</a>
      <a href="#publications">Publications</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#volunteering">Organisations</a>
      <button id="theme-toggle" class="btn-toggle" aria-label="Toggle Dark/Light Mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="theme-text">Dark</span>
      </button>
    </div>
  </div>
</nav>

<section id="about">
  <div class="wrap fade-up" id="about-container"></div>
</section>

<section id="education">
  <div class="wrap fade-up">
    <h2>Education</h2>
    <div class="timeline" id="education-container"></div>
  </div>
</section>

<section id="experience">
  <div class="wrap fade-up">
    <h2>Professional Experience</h2>
    <div class="timeline" id="experience-container"></div>
    <div class="timeline-controls" id="exp-controls" style="display: none;"></div>
  </div>
</section>

<section id="publications">
  <div class="wrap fade-up">
    <h2>Academic Publications</h2>
    <div class="timeline" id="publications-container"></div>
  </div>
</section>

<section id="skills">
  <div class="wrap fade-up">
    <h2>Technical Skills</h2>
    <div class="skills-compact" id="skills-container"></div>
  </div>
</section>

<section id="projects">
  <div class="wrap fade-up">
    <h2>Projects</h2>
    <div class="grid" id="projects-container"></div>
    <div class="timeline-controls" id="proj-controls" style="display: none;"></div>
  </div>
</section>

<section id="volunteering">
  <div class="wrap fade-up">
    <h2>Organizations and Volunteering</h2>
    <div class="timeline" id="volunteering-container"></div>
    <div class="timeline-controls" id="vol-controls" style="display: none;"></div>
  </div>
</section>

<section id="personal">
  <div class="wrap fade-up">
    <h2>Personal</h2>
    <div id="personal-container"></div>
  </div>
</section>

<footer id="contact">
  <div class="wrap fade-up">
    <h2>Contact</h2>
    <div class="contact-list" id="contact-container"></div>
    <p class="fine" id="footer-fine"></p>
  </div>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof portfolioData === 'undefined') {
      console.error("data.js not found or portfolioData not defined.");
      return;
    }
    const d = portfolioData;

    document.getElementById('nav-name').textContent = d.about.name;

    let obfuscatedEmailDisplay = "";
    if (d.about.emailBase64) {
       const decodedEmail = atob(d.about.emailBase64);
       obfuscatedEmailDisplay = decodedEmail.replace('@', ' [at] ');
    }

    document.getElementById('about-container').innerHTML = `
      <div class="about-grid">
        <div class="about-text-col">
          <h1>${d.about.name}</h1>
          <div class="contact-inline">
            <a class="secure-email" data-email="${d.about.emailBase64}" title="Send Email">${obfuscatedEmailDisplay}</a>
            <span class="contact-sep">|</span>
            <a class="secure-link" data-href="${d.about.linkedinLinkBase64}">${d.about.linkedinText}</a>
            <span class="contact-sep">|</span>
            <a class="secure-link" data-href="${d.about.githubLinkBase64}">${d.about.githubText}</a>
            <span class="contact-sep">|</span>
            <a class="secure-link" data-href="${d.about.scholarLinkBase64}">${d.about.scholarText}</a>
            <span class="contact-sep">|</span>
            <a class="secure-pdf" data-pdf="${d.about.resumePdfBase64}" style="cursor: pointer;" title="View PDF Resume">[PDF Resume]</a>
          </div>
          <div class="about-content">
            <p style="display: block; list-style-type: none; margin-left: 0;">${d.about.roleDescription}</p>
          </div>
        </div>
        <div class="about-widget-col">
          <iframe src="fdtd_widget.html" title="FDTD Simulation Widget" scrolling="no"></iframe>
        </div>
      </div>
    `;

    const eduHTML = d.education.map(item => `
      <div class="timeline-item">
        <div class="meta">
          <span class="org">${item.institution}</span>
          <span class="date">${item.period}</span>
        </div>
        <h3>${item.degree}</h3>
        ${item.location ? `<h4>${item.location}</h4>` : ''}
        ${item.content}
      </div>
    `).join('');
    document.getElementById('education-container').innerHTML = eduHTML;

    const skillsHTML = d.skills.map(group => {
      const tags = group.items.split(',').map(item => `<span class="tech-tag">${item.trim()}</span>`).join('');
      return `
        <div class="skill-row">
          <div class="skill-cat">${group.category}</div>
          <div class="skill-items">${tags}</div>
        </div>
      `;
    }).join('');
    document.getElementById('skills-container').innerHTML = skillsHTML;

    function buildTimelineHTML(items, thresholdYear, containerId, controlsId) {
      let html = '';
      let hasHidden = false;
      items.forEach(item => {
        const parts = item.period.split('-');
        const endPart = parts[parts.length - 1];
        const match = endPart.match(/\d{4}/);
        const endYear = match ? parseInt(match[0], 10) : 9999;

        const isHidden = endYear <= thresholdYear;
        if (isHidden) hasHidden = true;

        html += `
          <div class="timeline-item ${isHidden ? 'hidden-item' : ''}">
            <div class="meta">
              <span class="org">${item.organization}</span>
              <span class="date">${item.period}</span>
            </div>
            <h3>${item.title}</h3>
            ${item.location ? `<h4>${item.location}</h4>` : ''}
            ${item.content}
          </div>
        `;
      });
      document.getElementById(containerId).innerHTML = html;

      if (hasHidden) {
        const controls = document.getElementById(controlsId);
        controls.innerHTML = `<button class="btn-toggle expand-btn" onclick="toggleHidden(this)">Show More</button>`;
        controls.style.display = 'block';
      }
    }

    window.toggleHidden = function(btn) {
      const containerSection = btn.closest('section');
      const hiddenItems = containerSection.querySelectorAll('.hidden-item');
      const isExpanding = btn.textContent === 'Show More';

      hiddenItems.forEach(item => {
        if (isExpanding) {
          item.classList.add('revealed');
        } else {
          item.classList.remove('revealed');
        }
      });

      btn.textContent = isExpanding ? 'Show Less' : 'Show More';
    };

    buildTimelineHTML(d.experience, 2017, 'experience-container', 'exp-controls');
    buildTimelineHTML(d.volunteering, 2020, 'volunteering-container', 'vol-controls');

    const pubHTML = d.publications.map(item => {
      let linksHTML = '';
      if (item.links && item.links.length > 0) {
        linksHTML += item.links.map(link => `<a class="secure-link" data-href="${link.urlBase64}">[${link.label}]</a>`).join(' ');
      }
      if (item.pdfBase64) {
        linksHTML += ` <a class="secure-pdf" data-pdf="${item.pdfBase64}" title="View PDF">[PDF]</a>`;
      }
      return `
        <div class="timeline-item">
          <div class="meta" style="margin-bottom: 0.15rem;">
            <span class="org" style="font-weight: 400;">${item.title}</span>
          </div>
          <h3 style="margin-bottom: 0.2rem; font-size: 0.95rem;">${item.authors}</h3>
          <div>
            <span style="font-style: italic; color: var(--accent); font-size: 0.9rem;">${item.venue}</span>
            ${linksHTML ? `<span style="font-family: var(--font-mono); font-size: 0.85rem; margin-left: 0.4rem;">${linksHTML.trim()}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('publications-container').innerHTML = pubHTML;

    let projHTML = '';
    let hasHiddenProj = false;
    d.projects.forEach((item, index) => {
      const isHidden = index >= 4;
      if (isHidden) hasHiddenProj = true;
      projHTML += `
        <div class="card ${isHidden ? 'hidden-item' : ''}">
          <div class="year">${item.year}</div>
          <h3>${item.title}</h3>
          <p style="display: block; list-style-type: none; margin-left: 0;">${item.description}</p>
          <div class="links"><a class="secure-pdf" data-pdf="${item.linkBase64}" title="View PDF">[View PDF]</a></div>
        </div>
      `;
    });
    document.getElementById('projects-container').innerHTML = projHTML;

    if (hasHiddenProj) {
      const controls = document.getElementById('proj-controls');
      controls.innerHTML = `<button class="btn-toggle expand-btn" onclick="toggleHidden(this)">Show More</button>`;
      controls.style.display = 'block';
    }

    const personalHTML = d.personal.map(p => `<li>${p}</li>`).join('');
    document.getElementById('personal-container').innerHTML = `
      <ul class="personal-list">
        ${personalHTML}
      </ul>
    `;

    document.getElementById('contact-container').innerHTML = `
      <div><span class="k">Email:</span> <a class="secure-email" data-email="${d.about.emailBase64}" title="Send Email">${obfuscatedEmailDisplay}</a></div>
      <div><span class="k">GitHub:</span> <a class="secure-link" data-href="${d.about.githubLinkBase64}">${d.about.githubText}</a></div>
      <div><span class="k">LinkedIn:</span> <a class="secure-link" data-href="${d.about.linkedinLinkBase64}">${d.about.linkedinText}</a></div>
      <div><span class="k">Scholar:</span> <a class="secure-link" data-href="${d.about.scholarLinkBase64}">${d.about.scholarText}</a></div>
    `;

    document.getElementById('footer-fine').textContent = `© ${new Date().getFullYear()} ${d.about.name}. Structured in HTML/CSS/JS.`;

    document.querySelectorAll('.secure-email').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const email = atob(this.getAttribute('data-email'));
        window.location.href = 'mailto:' + email;
      });
    });

    document.querySelectorAll('.secure-link').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const url = atob(this.getAttribute('data-href'));
        window.open(url, '_blank');
      });
    });

    document.querySelectorAll('.secure-pdf').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const base64Url = this.getAttribute('data-pdf');
        if(base64Url) {
           const decodedUrl = atob(base64Url);
           window.open(decodedUrl, '_blank');
        }
      });
    });

    const themeToggleBtn = document.getElementById('theme-toggle');
    const iconSvg = document.getElementById('theme-icon');
    const textSpan = document.getElementById('theme-text');
    const htmlElement = document.documentElement;

    const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

    const updateToggleState = (theme) => {
      if (theme === 'dark') {
        iconSvg.innerHTML = moonIcon;
        textSpan.textContent = 'Dark';
      } else {
        iconSvg.innerHTML = sunIcon;
        textSpan.textContent = 'Light';
      }
    };

    const savedTheme = localStorage.getItem('theme') || 'dark';
    htmlElement.setAttribute('data-theme', savedTheme);
    updateToggleState(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateToggleState(newTheme);
    });

    const items = document.querySelectorAll('.fade-up');
    if (!('IntersectionObserver' in window)) {
      items.forEach(el => el.classList.add('in'));
    } else {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      items.forEach(el => io.observe(el));
    }
  });
</script>
