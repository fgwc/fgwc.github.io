  }

  [data-theme="light"] {

    --nav-bg: rgba(251, 249, 246, 0.95);
    --border: #dfd8d1;
    --text: #3d3734;
    --text-muted: #756a65;
    --heading-color: #1a1715;
    --accent: #c45d29;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  code, .mono, nav a {
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-serif);
    font-weight: 400;
    color: var(--heading-color);
    transition: color 0.2s ease;
  }

  a { color: var(--accent); text-decoration: none; transition: color 0.15s ease; }
  a:hover, a:focus-visible { text-decoration: underline; }
  ::selection { background: var(--accent-dim); color: #fff; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 1.25rem; }

  nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--nav-bg); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  nav .wrap {
    display: flex; justify-content: space-between; align-items: center;
    height: 3rem; font-size: 0.8rem; overflow-x: auto;
  }

  nav .brand {
    color: var(--heading-color); font-family: var(--font-serif);

  }

  nav .links a { color: var(--text-muted); }
  nav .links a:hover { color: var(--accent); }

  .btn-toggle {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.25rem 0.6rem;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .btn-toggle svg { width: 14px; height: 14px; }

  section {
    padding: 2.5rem 0;
    border-bottom: 1px solid var(--border);
    transition: border-color 0.2s ease;
  }
  section:last-of-type { border-bottom: none; }

  h1 { font-size: 2.2rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.45rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }

  .fade-up { opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .fade-up.in { opacity: 1; transform: translateY(0); }

  /* About Info Formatting */
  .contact-inline {
    display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
    margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem;
  }
  .contact-inline a { display: inline-flex; align-items: center; color: var(--text-muted); }
  .contact-inline a:hover { color: var(--accent); }
  .contact-sep { color: var(--border); user-select: none; }
  .about-content { font-size: 1.08rem; line-height: 1.6; max-width: 75ch; color: var(--text); }

  /* Footer Contact Formatting */
  .contact-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .contact-list .k { color: var(--text-muted); display: inline-block; width: 6rem; }

  /* General Timeline and Entries */
  .timeline { margin-top: 0.5rem; border-left: 1px solid var(--border); padding-left: 1.25rem; }
  .timeline-item { position: relative; margin-bottom: 1.75rem; }
  .timeline-item:last-child { margin-bottom: 0; }
  .timeline-item::before {
    content: ""; position: absolute; left: -1.5rem; top: 0.5rem;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent);
  }

  .timeline-item .meta {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    margin-bottom: 0.25rem; font-family: var(--font-main); flex-wrap: nowrap;
  }

    font-weight: 600; color: var(--heading-color); font-size: 1.1rem; flex: 1 1 auto; word-break: break-word; line-height: 1.3;

  .timeline-item .meta .date {

  .timeline-item h4 { font-size: 0.9rem; font-weight: 400; font-style: italic; color: var(--text-muted); margin-bottom: 0.5rem; }

  /* Bulleted format for all entry descriptions */
  .timeline-item p, .cv-bullets li {
    display: list-item;
    list-style-type: disc;
    margin-left: 1.25rem;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  .timeline-item p:last-child, .cv-bullets li:last-child { margin-bottom: 0; }
  .cv-bullets { margin: 0; padding: 0; }

  /* Expandable sections */
  .hidden-item { display: none; }
  .hidden-item.revealed { display: block; }

  .timeline-controls {
    position: relative;
    margin-top: -0.25rem;
  }
  .expand-btn {
    font-family: var(--font-main);
    font-size: 0.85rem;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--accent);
    color: var(--heading-color);
    background: var(--bg-panel);
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .expand-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* Skills Block - Compact Dictionary Layout */
  .skills-compact { display: flex; flex-direction: column; gap: 0.85rem; }
  .skill-row { display: flex; align-items: baseline; line-height: 1.5; }
  .skill-cat { flex: 0 0 200px; font-weight: 600; color: var(--heading-color); font-size: 0.95rem; }
  .skill-items { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tech-tag {
    background: var(--bg-panel); border: 1px solid var(--border);
    padding: 0.15rem 0.4rem; border-radius: 3px; color: var(--text);
    font-family: var(--font-mono); font-size: 0.82rem; display: inline-block;
  }

  @media (max-width: 600px) {
    .skill-row { flex-direction: column; gap: 0.4rem; }
    .skill-cat { flex: 0 0 auto; }
  }

  /* Publications */
  .publication { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px dotted var(--border); }
  .publication:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .publication h3 { font-size: 1.05rem; font-family: var(--font-main); font-weight: 500; color: var(--heading-color); margin-bottom: 0.25rem; }
  .publication .venue { font-style: italic; color: var(--accent); font-size: 0.9rem; display: inline; }
  .publication .links { display: inline; font-family: var(--font-mono); font-size: 0.85rem; margin-left: 0.4rem; }

  /* Projects Grid */
  .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(2, 1fr); margin-top: 0.5rem; }
  @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem;
    transition: border-color 0.15s ease; display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--text-muted); }
  .card .year { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); margin-bottom: 0.35rem; }
  .card h3 { font-size: 1.05rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--heading-color); }
  .card p { color: var(--text); font-size: 0.9rem; margin-bottom: 1rem; flex-grow: 1; display: block; list-style-type: none; margin-left: 0; }
  .card .links { font-family: var(--font-mono); font-size: 0.85rem; }

  /* Personal Block Aesthetic List */
  .personal-list { list-style: none; padding: 0; margin: 0; }
  .personal-list li { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; color: var(--text); font-size: 0.95rem; }
  .personal-list li::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--accent); }

  footer { padding: 3rem 0; border-top: 1px solid var(--border); background: var(--bg-panel); }
  footer .fine { margin-top: 2rem; color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

        <span class="contact-sep">|</span>
        <a href="https://${d.about.linkedinLink}">${d.about.linkedinText}</a>
        <span class="contact-sep">|</span>
        <a href="https://${d.about.githubLink}">${d.about.githubText}</a>
        <span class="contact-sep">|</span>
        <a href="${d.about.scholarLink}" target="_blank">${d.about.scholarText}</a>
        <span class="contact-sep">|</span>
        <a href="${d.about.resumePdf}" target="_blank">[PDF Resume]</a>
      </div>
      <div class="about-content">
        <p style="display: block; list-style-type: none; margin-left: 0;">${d.about.roleDescription}</p>
      </div>
    `;

    const eduHTML = d.education.map(item => `
      <div class="timeline-item">
        <div class="meta">
          <span class="org">${item.institution}</span>
          <span class="date">${item.period}</span>
        </div>
        <h3>${item.degree}</h3>
        ${item.location ? `<h4>${item.location}</h4>` : ''}
        ${item.content}
      </div>
    `).join('');
    document.getElementById('education-container').innerHTML = eduHTML;

    const skillsHTML = d.skills.map(group => {
      const tags = group.items.split(',').map(item => `<span class="tech-tag">${item.trim()}</span>`).join('');
      return `
        <div class="skill-row">
          <div class="skill-cat">${group.category}</div>
          <div class="skill-items">${tags}</div>
        </div>
      `;
    }).join('');
    document.getElementById('skills-container').innerHTML = skillsHTML;

    function buildTimelineHTML(items, thresholdYear) {
      let html = '';
      let hasHidden = false;
      items.forEach(item => {
        const parts = item.period.split('-');
        const endPart = parts[parts.length - 1];
        const match = endPart.match(/\d{4}/);
        const endYear = match ? parseInt(match[0], 10) : 9999;

        const isHidden = endYear <= thresholdYear;
        if (isHidden) hasHidden = true;

        html += `
          <div class="timeline-item ${isHidden ? 'hidden-item' : ''}">
            <div class="meta">
              <span class="org">${item.organization}</span>
              <span class="date">${item.period}</span>
            </div>
            <h3>${item.title}</h3>
            ${item.location ? `<h4>${item.location}</h4>` : ''}
            ${item.content}
          </div>
        `;
      });
      if (hasHidden) {
        html += `<div class="timeline-controls"><button class="btn-toggle expand-btn" onclick="toggleHidden(this)">Show More</button></div>`;
      }
      return html;
    }

    window.toggleHidden = function(btn) {
      const container = btn.closest('.timeline');
      const hiddenItems = container.querySelectorAll('.hidden-item');
      const isExpanding = btn.textContent === 'Show More';

      hiddenItems.forEach(item => {
        if (isExpanding) {
          item.classList.add('revealed');
        } else {
          item.classList.remove('revealed');
        }
      });

      btn.textContent = isExpanding ? 'Show Less' : 'Show More';
    };

    document.getElementById('experience-container').innerHTML = buildTimelineHTML(d.experience, 2017);

    document.getElementById('volunteering-container').innerHTML = buildTimelineHTML(d.volunteering, 2020);

    const pubHTML = d.publications.map(item => `
      <div class="publication">
        <h3>${item.title}</h3>
        <div>
          <span class="venue">${item.venue}</span>
          ${item.links.length > 0 ? `<span class="links">${item.links.map(link => `<a href="${link.url}" target="_blank">[${link.label}]</a>`).join(' ')}</span>` : ''}
        </div>
      </div>
    `).join('');
    document.getElementById('publications-container').innerHTML = pubHTML;

    const projHTML = d.projects.map(item => `
      <div class="card">
        <div class="year">${item.year}</div>
        <h3>${item.title}</h3>
        <p style="display: block; list-style-type: none; margin-left: 0;">${item.description}</p>
        <div class="links"><a href="${item.link}" target="_blank">[View PDF]</a></div>
      </div>
    `).join('');
    document.getElementById('projects-container').innerHTML = projHTML;

    const personalHTML = d.personal.map(p => `<li>${p}</li>`).join('');
    document.getElementById('personal-container').innerHTML = `
      <ul class="personal-list">
        ${personalHTML}
      </ul>
    `;

    document.getElementById('contact-container').innerHTML = `
      <div><span class="k">Email:</span> <a href="mailto:${d.about.emailLink}">${d.about.emailText}</a></div>
      <div><span class="k">GitHub:</span> <a href="https://${d.about.githubLink}">${d.about.githubText}</a></div>
      <div><span class="k">LinkedIn:</span> <a href="https://${d.about.linkedinLink}">${d.about.linkedinText}</a></div>
      <div><span class="k">Scholar:</span> <a href="${d.about.scholarLink}">${d.about.scholarText}</a></div>
    `;

    document.getElementById('footer-fine').textContent = `© ${new Date().getFullYear()} ${d.about.name}. Structured in HTML/CSS/JS.`;

    const themeToggleBtn = document.getElementById('theme-toggle');
    const iconSvg = document.getElementById('theme-icon');
    const textSpan = document.getElementById('theme-text');
    const htmlElement = document.documentElement;

    const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

    const updateToggleState = (theme) => {
      if (theme === 'dark') {
        iconSvg.innerHTML = moonIcon;
        textSpan.textContent = 'Dark';
      } else {
        iconSvg.innerHTML = sunIcon;
        textSpan.textContent = 'Light';
      }
    };

    const savedTheme = localStorage.getItem('theme') || 'dark';
    htmlElement.setAttribute('data-theme', savedTheme);
    updateToggleState(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateToggleState(newTheme);
    });

    const items = document.querySelectorAll('.fade-up');
    if (!('IntersectionObserver' in window)) {
      items.forEach(el => el.classList.add('in'));
    } else {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      items.forEach(el => io.observe(el));
    }
  });
</script>
</body>
</html>
