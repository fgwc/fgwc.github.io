<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM Simulation Widget</title>
    <style>
        /* * Color palette and typography definitions mapping to the host webpage.
         */
        :root {
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --font-serif: "Charter", "Georgia", "Times New Roman", serif;
            --bg: #1f1b19;
            --bg-panel: #292421;
            --border: #3d3531;
            --text: #d4cec9;
            --text-muted: #9e938e;
            --heading-color: #f2ebe6;
            --accent: #d98253;
            --neg: #8e9296;
        }

        body {
            background-color: transparent;
            color: var(--text);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
        }

        .widget {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            width: 360px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        h3 {
            font-family: var(--font-serif);
            color: var(--heading-color);
            margin: 0;
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.1;
        }

        .subtitle {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .primary-btn {
            font-family: var(--font-main);
            font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border: 1px solid var(--accent);
            color: var(--heading-color);
            background: var(--bg-panel);
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            min-width: 80px;
        }

        .primary-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .primary-btn.paused {
            background: var(--accent);
            color: var(--bg);
        }

        .sim-container {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 250px;
        }

        .sim-area {
            position: relative;
            width: 260px;
            height: 250px;
        }

        .canvas-container {
            position: absolute;
            top: 10px;
            left: 50px;
            width: 200px;
            height: 200px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .axes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .legend-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
            padding-bottom: 40px;
            width: 60px;
        }

        .legend-bar {
            width: 10px;
            height: 100%;
            background: linear-gradient(to top, var(--neg), var(--bg-panel), var(--accent));
            border: 1px solid var(--border);
            border-radius: 2px;
        }

        .legend-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select {
            background: var(--bg);
            color: var(--heading-color);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="range"] {
            width: 140px;
            accent-color: var(--accent);
        }

        .val-display {
            color: var(--heading-color);
            font-weight: 500;
            font-size: 0.95rem;
            font-family: var(--font-mono);
            width: 45px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="widget">
    <div class="header">
        <div class="title-block">
            <h3>TMz Plane Wave</h3>
            <div class="subtitle">FDTD Scattering off PEC (λ=12)</div>
        </div>
        <button id="playPauseBtn" class="primary-btn">Pause</button>
    </div>

    <div class="sim-container">
        <div class="sim-area">
            <div class="canvas-container">
                <canvas id="emCanvas" width="200" height="200"></canvas>
            </div>
            <svg class="axes" viewBox="0 0 260 250">
                <g stroke="var(--border)" stroke-width="1">
                    <line x1="50" y1="210" x2="250" y2="210" />
                    <line x1="50" y1="210" x2="50" y2="10" />
                    <line x1="50" y1="210" x2="50" y2="215" />
                    <line x1="150" y1="210" x2="150" y2="215" />
                    <line x1="250" y1="210" x2="250" y2="215" />
                    <line x1="45" y1="210" x2="50" y2="210" />
                    <line x1="45" y1="110" x2="50" y2="110" />
                    <line x1="45" y1="10" x2="50" y2="10" />
                </g>
                <g fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12.5" text-anchor="middle">
                    <text x="50" y="230">-8.3</text>
                    <text x="150" y="230">0</text>
                    <text x="250" y="230">8.3</text>
                </g>
                <g fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12.5" text-anchor="end" alignment-baseline="middle">
                    <text x="40" y="210">-8.3</text>
                    <text x="40" y="110">0</text>
                    <text x="40" y="10">8.3</text>
                </g>
                <text x="14" y="110" fill="var(--text-muted)" font-family="var(--font-main)" font-size="14" text-anchor="middle" transform="rotate(-90 14 110)">Position Y (λ)</text>
                <text x="150" y="248" fill="var(--text-muted)" font-family="var(--font-main)" font-size="14" text-anchor="middle">Position X (λ)</text>
            </svg>
        </div>

        <div class="legend-area">
            <div class="legend-bar"></div>
            <div class="legend-labels">
                <span>+Max</span>
                <span>0</span>
                <span>-Max</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <label for="fieldSelect">Field View</label>
            <select id="fieldSelect">
                <option value="scattered">Scattered</option>
                <option value="total">Total</option>
            </select>
        </div>
        <div class="row">
            <label for="speedSlider">Sim Speed</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="range" id="speedSlider" min="0.25" max="2" value="0.25" step="0.25">
                <span id="speedVal" class="val-display">0.25x</span>
            </div>
        </div>
        <div class="row">
            <label for="rotSlider">Rotation</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="range" id="rotSlider" min="0" max="360" value="45" step="1">
                <span id="rotVal" class="val-display">45°</span>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('emCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fieldSelect = document.getElementById('fieldSelect');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const speedSlider = document.getElementById('speedSlider');
    const rotSlider = document.getElementById('rotSlider');

    // Domain parameters
    const N = 200; // Grid spatial resolution $N \times N$
    const sponge = 30; // Thickness of absorbing boundary layer in cells
    const max_gamma = 0.15; // Peak conductivity of the absorbing layer

    // Wave properties
    const lambda = 12; // Wavelength in grid cells
    const v = 0.5; // Phase velocity in cells per time step (Courant limit is $v \le 1/\sqrt{2} \approx 0.707$)
    const omega = (2 * Math.PI * v) / lambda; // Angular frequency $\omega = k \cdot v$

    // FDTD Arrays (Flattened 1D arrays representing 2D scalar fields)
    // u1 models the Total Field (contains the scattering object).
    let u1 = new Float32Array(N * N);
    let u1_prev = new Float32Array(N * N);
    let u1_next = new Float32Array(N * N);

    // u2 models the Incident Field exclusively (vacuum space).
    let u2 = new Float32Array(N * N);
    let u2_prev = new Float32Array(N * N);
    let u2_next = new Float32Array(N * N);

    let mask = new Uint8Array(N * N); // Boolean mask defining the Perfect Electric Conductor (PEC) boundary
    let gamma = new Float32Array(N * N); // Spatially dependent loss vector to absorb outgoing waves
    let time = 0;

    // Display Parameters
    let renderMode = 'scattered';
    const amplitudeMax = 0.45; // Field clamp limit for colormap scaling
    let isPaused = false;
    let simSpeed = 0.25;
    let stepAccumulator = 0; // Fractional step accumulator for smooth sub-integer execution speeds
    let currentPoly = []; // Stored vertices of the currently rotated object

    // Core RGB color assignments matching host theme
    const c0 = [41, 36, 33]; // Background
    const cPos = [217, 130, 83]; // Positive field peak
    const cNeg = [142, 146, 150]; // Negative field peak

    /**
     * Initializes the lossy sponge layer approximating a Perfectly Matched Layer (PML).
     * Conductivity profile scales monotonically according to polynomial grading (power 3)
     * to eliminate hard boundary impedance mismatches.
     * Profile: $\sigma(x) = \sigma_{max} (\frac{x}{d})^3$
     */
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            let dx = 0, dy = 0;
            if (i < sponge) dx = (sponge - i) / sponge;
            if (i > N - 1 - sponge) dx = (i - (N - 1 - sponge)) / sponge;
            if (j < sponge) dy = (sponge - j) / sponge;
            if (j > N - 1 - sponge) dy = (j - (N - 1 - sponge)) / sponge;
            gamma[i + j * N] = max_gamma * Math.pow(Math.max(dx, dy), 3);
        }
    }

    /**
     * Generates the Perfect Electric Conductor (PEC) boundary object inside the grid.
     * Applies standard affine 2D rotation matrix:
     * $x' = x \cos(\theta) - y \sin(\theta)$
     * $y' = x \sin(\theta) + y \cos(\theta)$
     */
    function updateObjectMask(rotationDeg) {
        mask.fill(0);
        const theta = rotationDeg * Math.PI / 180;
        const cx = 100, cy = 100; // Center coordinate

        // Base definition of the unrotated asymmetric payload shape
        const basePoly = [
            {x: 0, y: 25},
            {x: 10, y: 12},
            {x: 10, y: -25},
            {x: -10, y: -25},
            {x: -10, y: 12}
        ];

        // Apply rotational mapping relative to origin
        currentPoly = basePoly.map(p => ({
            x: cx + p.x * Math.cos(theta) - p.y * Math.sin(theta),
            y: cy + p.x * Math.sin(theta) + p.y * Math.cos(theta)
        }));

        // Point-in-polygon ray casting implementation (Jordan curve theorem).
        // Rasterizes the abstract polygon definition onto the discrete spatial lattice.
        for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
                let inside = false;
                for (let k = 0, l = currentPoly.length - 1; k < currentPoly.length; l = k++) {
                    let xi = currentPoly[k].x, yi = currentPoly[k].y;
                    let xj = currentPoly[l].x, yj = currentPoly[l].y;
                    let intersect = ((yi > j) != (yj > j)) && (i < (xj - xi) * (j - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                if (inside) mask[i + j * N] = 1;
            }
        }
    }

    rotSlider.addEventListener('input', (e) => {
        document.getElementById('rotVal').innerText = e.target.value + '°';
        updateObjectMask(parseFloat(e.target.value));
        if (isPaused) render();
    });

    speedSlider.addEventListener('input', (e) => {
        simSpeed = parseFloat(e.target.value);
        document.getElementById('speedVal').innerText = simSpeed + 'x';
    });

    fieldSelect.addEventListener('change', (e) => {
        renderMode = e.target.value;
        if (isPaused) render();
    });

    playPauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        playPauseBtn.textContent = isPaused ? 'Play' : 'Pause';
        playPauseBtn.classList.toggle('paused', isPaused);
    });

    // Initial boundary definition
    updateObjectMask(45);
    const imgData = ctx.createImageData(N, N);

    /**
     * Core time-marching algorithm based on the explicit Finite Difference Time Domain (FDTD) method.
     * Solves the scalar wave equation with damping:
     * $$ \frac{\partial^2 u}{\partial t^2} = v^2 \nabla^2 u - \gamma \frac{\partial u}{\partial t} $$
     */
    function step() {
        for (let i = 1; i < N - 1; i++) {
            for (let j = 1; j < N - 1; j++) {
                let idx = i + j * N;
                let g = gamma[idx]; // Local damping constant

                // 5-point discrete spatial Laplacian operator for 2D cartesian grid:
                // $$ \nabla^2 u \approx \frac{u_{i-1, j} + u_{i+1, j} + u_{i, j-1} + u_{i, j+1} - 4u_{i, j}}{\Delta x^2} $$
                let lap1 = u1[idx - 1] + u1[idx + 1] + u1[idx - N] + u1[idx + N] - 4 * u1[idx];

                // Total Field Time Integration step:
                // Yielded by isolating $u(t+\Delta t)$ from discretized central finite difference approximations.
                // The coefficient 0.25 derives from $(v \frac{\Delta t}{\Delta x})^2$, where $v = 0.5$.
                u1_next[idx] = (2 * u1[idx] - (1 - g) * u1_prev[idx] + 0.25 * lap1) / (1 + g);

                // Incident Field Time Integration step (Simulated identically but unconditionally empty domain):
                let lap2 = u2[idx - 1] + u2[idx + 1] + u2[idx - N] + u2[idx + N] - 4 * u2[idx];
                u2_next[idx] = (2 * u2[idx] - (1 - g) * u2_prev[idx] + 0.25 * lap2) / (1 + g);
            }
        }

        // Incident soft-source plane wave injection.
        // Superimposed onto the grid via soft boundary formulation ($u = u + E_{inc}$) to avoid non-physical scattering.
        const src_val = 0.25 * Math.sin(omega * time);
        for (let j = 0; j < N; j++) {
            u1_next[32 + j * N] += src_val;
            u2_next[32 + j * N] += src_val;
        }

        // Enforce Perfect Electric Conductor (PEC) hard boundary condition:
        // Tangential electric field components vanish identically ($u = 0$).
        for (let idx = 0; idx < N * N; idx++) {
            if (mask[idx]) u1_next[idx] = 0;
        }

        // Rotate memory buffers for state advancement ($u_{t-1} \leftarrow u_{t}$, $u_t \leftarrow u_{t+1}$)
        let t1 = u1_prev; u1_prev = u1; u1 = u1_next; u1_next = t1;
        let t2 = u2_prev; u2_prev = u2; u2 = u2_next; u2_next = t2;
        time++;
    }

    /**
     * Map scalar field amplitudes to spatial view array.
     */
    function render() {
        const data = imgData.data;
        for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
                let idx = i + j * N;
                // Invert Y axis logically to place the Cartesian origin at standard bottom-left.
                let screen_y = N - 1 - j;
                let px = (i + screen_y * N) * 4;

                // Pure scattered field derived by linear superposition: $E_{scat} = E_{tot} - E_{inc}$
                let val = renderMode === 'scattered' ? (u1[idx] - u2[idx]) : u1[idx];

                // Bipolar RGB channel linear interpolation
                if (val > 0) {
                    let t = Math.min(1, val / amplitudeMax);
                    data[px] = c0[0] + (cPos[0] - c0[0]) * t;
                    data[px+1] = c0[1] + (cPos[1] - c0[1]) * t;
                    data[px+2] = c0[2] + (cPos[2] - c0[2]) * t;
                } else {
                    let t = Math.min(1, -val / amplitudeMax);
                    data[px] = c0[0] + (cNeg[0] - c0[0]) * t;
                    data[px+1] = c0[1] + (cNeg[1] - c0[1]) * t;
                    data[px+2] = c0[2] + (cNeg[2] - c0[2]) * t;
                }
                data[px+3] = 255;
            }
        }

        // Flush buffer to graphic context
        ctx.putImageData(imgData, 0, 0);

        // Vector path rendering for sharp anti-aliased representation of the geometric outline over the pixelated simulation mask
        ctx.beginPath();
        for (let k = 0; k < currentPoly.length; k++) {
            let px = currentPoly[k].x;
            let py = N - 1 - currentPoly[k].y;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();

        ctx.fillStyle = '#1f1b19';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#d98253';
        ctx.stroke();
    }

    // Fast-forward simulation dynamically prior to visual mount (pre-loading wave incidence)
    for(let i = 0; i < 75; i++) {
        step();
    }
    render();

    /**
     * Canvas execution loop synced with browser refresh rate.
     */
    function animate() {
        if (!isPaused) {
            // Evaluates fractionary updates allowing continuous adjustable velocity ratios
            stepAccumulator += simSpeed;
            let stepsToTake = Math.floor(stepAccumulator);
            stepAccumulator -= stepsToTake;

            for (let s = 0; s < stepsToTake; s++) {
                step();
            }
            if (stepsToTake > 0) {
                render();
            }
        }
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
