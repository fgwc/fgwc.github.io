<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EM Simulation Widget</title>
    <style>
        :root {
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --font-serif: "Charter", "Georgia", "Times New Roman", serif;
        }

        [data-theme="dark"] {
            --bg: #1f1b19;
            --bg-panel: #292421;
            --border: #3d3531;
            --text: #d4cec9;
            --text-muted: #9e938e;
            --heading-color: #f2ebe6;
            --accent: #d98253;
            --neg: #8e9296;
        }

        [data-theme="light"] {
            --bg: #fbf9f6;
            --bg-panel: #f2efe9;
            --border: #dfd8d1;
            --text: #3d3734;
            --text-muted: #756a65;
            --heading-color: #1a1715;
            --accent: #c45d29;
            --neg: #8e9296;
        }

        html.theme-transition,
        html.theme-transition *,
        html.theme-transition *:before,
        html.theme-transition *:after {
            transition: background-color 2s ease, color 2s ease, border-color 2s ease, fill 2s ease, stroke 2s ease !important;
            transition-delay: 0s !important;
        }

        body {
            background-color: transparent;
            color: var(--text);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .widget {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            width: 360px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            transition: border-color 0.2s ease;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        h3 {
            font-family: var(--font-serif);
            color: var(--heading-color);
            margin: 0;
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.1;
            transition: color 0.2s ease;
        }

        .subtitle {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .primary-btn {
            font-family: var(--font-main);
            font-size: 0.85rem;
            padding: 0.35rem 0.85rem;
            border: 1px solid var(--accent);
            color: var(--heading-color);
            background-color: var(--bg-panel);
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            min-width: 80px;
        }

        .primary-btn:hover {
            background-color: var(--accent);
            color: var(--bg);
        }

        .primary-btn.paused {
            background-color: var(--accent);
            color: var(--bg);
        }

        .sim-container {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 250px;
        }

        .sim-area {
            position: relative;
            width: 260px;
            height: 250px;
        }

        .canvas-container {
            position: absolute;
            top: 10px;
            left: 50px;
            width: 200px;
            height: 200px;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .axes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .legend-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
            padding-bottom: 40px;
            width: 60px;
        }

        .legend-bar {
            width: 10px;
            height: 100%;
            background: linear-gradient(to top, var(--neg), var(--bg-panel), var(--accent));
            border: 1px solid var(--border);
            border-radius: 2px;
            transition: border-color 0.2s ease;
        }

        .legend-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        select {
            background-color: var(--bg);
            color: var(--heading-color);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-main);
            font-size: 12.5px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="range"] {
            width: 140px;
            accent-color: var(--accent);
        }

        select:disabled, input[type="range"]:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .val-display {
            color: var(--heading-color);
            font-weight: 500;
            font-size: 12.5px;
            font-family: var(--font-mono);
            width: 45px;
            text-align: right;
            transition: color 0.2s ease;
        }
    </style>
</head>
<body>

<div class="widget">
    <div class="header">
        <div class="title-block">
            <h3>TMz Plane Wave</h3>
            <div class="subtitle">FDTD Scattering off PEC</div>
        </div>
        <button id="playPauseBtn" class="primary-btn">Pause</button>
    </div>

    <div class="sim-container">
        <div class="sim-area">
            <div class="canvas-container">
                <canvas id="emCanvas" width="200" height="200"></canvas>
            </div>
            <svg class="axes" viewBox="0 0 260 250">
                <g stroke="var(--border)" stroke-width="1" style="transition: stroke 0.2s ease">
                    <line x1="50" y1="210" x2="250" y2="210" />
                    <line x1="50" y1="210" x2="50" y2="10" />
                    <line x1="50" y1="210" x2="50" y2="215" />
                    <line x1="150" y1="210" x2="150" y2="215" />
                    <line x1="250" y1="210" x2="250" y2="215" />
                    <line x1="45" y1="210" x2="50" y2="210" />
                    <line x1="45" y1="110" x2="50" y2="110" />
                    <line x1="45" y1="10" x2="50" y2="10" />
                </g>
                <g fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12.5" text-anchor="middle" style="transition: fill 0.2s ease">
                    <text x="50" y="230">-8.3</text>
                    <text x="150" y="230">0</text>
                    <text x="250" y="230">8.3</text>
                </g>
                <g fill="var(--text-muted)" font-family="var(--font-mono)" font-size="12.5" text-anchor="end" alignment-baseline="middle" style="transition: fill 0.2s ease">
                    <text x="40" y="210">-8.3</text>
                    <text x="40" y="110">0</text>
                    <text x="40" y="10">8.3</text>
                </g>
                <text x="14" y="110" fill="var(--text-muted)" font-family="var(--font-main)" font-size="14" text-anchor="middle" transform="rotate(-90 14 110)" style="transition: fill 0.2s ease">Position Y (λ)</text>
                <text x="150" y="248" fill="var(--text-muted)" font-family="var(--font-main)" font-size="14" text-anchor="middle" style="transition: fill 0.2s ease">Position X (λ)</text>
            </svg>
        </div>

        <div class="legend-area">
            <div class="legend-bar"></div>
            <div class="legend-labels">
                <span>+Max</span>
                <span>0</span>
                <span>-Max</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <label for="fieldSelect">Field View</label>
            <select id="fieldSelect">
                <option value="scattered">Scattered</option>
                <option value="total">Total</option>
            </select>
        </div>
        <div class="row">
            <label for="speedSlider">Sim Speed</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="range" id="speedSlider" min="0.25" max="2" value="0.25" step="0.25">
                <span id="speedVal" class="val-display">0.25x</span>
            </div>
        </div>
        <div class="row">
            <label for="rotSlider">Rotation</label>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="range" id="rotSlider" min="0" max="360" value="45" step="1">
                <span id="rotVal" class="val-display">45°</span>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('emCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const fieldSelect = document.getElementById('fieldSelect');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const speedSlider = document.getElementById('speedSlider');
    const rotSlider = document.getElementById('rotSlider');

    const N = 200;
    const sponge = 30;
    const sigma_max = 1.0;
    const lambda = 12;
    const v = 0.5;
    const omega = (2 * Math.PI * v) / lambda;

    const bx = new Float32Array(N), cx = new Float32Array(N);
    const bxh = new Float32Array(N), cxh = new Float32Array(N);
    const by = new Float32Array(N), cy = new Float32Array(N);
    const byh = new Float32Array(N), cyh = new Float32Array(N);

    const m_pml = 3;
    for (let i = 0; i < N; i++) {
        let dx = 0;
        if (i < sponge) dx = sponge - i;
        else if (i > N - 1 - sponge) dx = i - (N - 1 - sponge);
        let sig = sigma_max * Math.pow(dx / sponge, m_pml);
        bx[i] = Math.exp(-sig);
        cx[i] = bx[i] - 1.0;
        by[i] = bx[i];
        cy[i] = cx[i];

        let hx = 0;
        let i_half = i + 0.5;
        if (i_half < sponge) hx = sponge - i_half;
        else if (i_half > N - 1 - sponge) hx = i_half - (N - 1 - sponge);
        let sigH = sigma_max * Math.pow(Math.max(0, hx) / sponge, m_pml);
        bxh[i] = Math.exp(-sigH);
        cxh[i] = bxh[i] - 1.0;
        byh[i] = bxh[i];
        cyh[i] = cxh[i];
    }

    const numCells = N * N;
    let Ez = new Float32Array(numCells);
    let Hx = new Float32Array(numCells);
    let Hy = new Float32Array(numCells);
    let psi_Ez_x = new Float32Array(numCells);
    let psi_Ez_y = new Float32Array(numCells);
    let psi_Hx_y = new Float32Array(numCells);
    let psi_Hy_x = new Float32Array(numCells);

    let Ez2 = new Float32Array(numCells);
    let Hx2 = new Float32Array(numCells);
    let Hy2 = new Float32Array(numCells);
    let psi_Ez2_x = new Float32Array(numCells);
    let psi_Ez2_y = new Float32Array(numCells);
    let psi_Hx2_y = new Float32Array(numCells);
    let psi_Hy2_x = new Float32Array(numCells);

    let mask = new Uint8Array(numCells);
    let time = 0;

    let renderMode = 'scattered';
    const amplitudeMax = 0.45;
    let isPaused = false;
    let simSpeed = 0.25;
    let stepAccumulator = 0;
    let currentPoly = [];

    let c0 = [41, 36, 33];
    let cPos = [217, 130, 83];
    let cNeg = [142, 146, 150];
    let pecFill_rgb = [31, 27, 25];
    let pecStroke_rgb = [217, 130, 83];

    let pecFill = `rgb(${pecFill_rgb[0]}, ${pecFill_rgb[1]}, ${pecFill_rgb[2]})`;
    let pecStroke = `rgb(${pecStroke_rgb[0]}, ${pecStroke_rgb[1]}, ${pecStroke_rgb[2]})`;

    window.addEventListener('load', () => {
        try {
            const parentHtml = window.parent.document.documentElement;
            if (parentHtml) {
                setTheme(parentHtml.getAttribute('data-theme'), false);
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.attributeName === 'data-theme') {
                            setTheme(parentHtml.getAttribute('data-theme'), true);
                        }
                    });
                });
                observer.observe(parentHtml, { attributes: true });
            }
        } catch (e) {}
    });

    function setTheme(theme, animate) {
        if (!theme) return;
        if (animate) document.documentElement.classList.add('theme-transition');
        document.documentElement.setAttribute('data-theme', theme);

        const target_c0 = theme === 'light' ? [242, 239, 233] : [41, 36, 33];
        const target_cPos = theme === 'light' ? [196, 93, 41] : [217, 130, 83];
        const target_cNeg = theme === 'light' ? [142, 146, 150] : [142, 146, 150];
        const target_pecFill = theme === 'light' ? [251, 249, 246] : [31, 27, 25];
        const target_pecStroke = theme === 'light' ? [196, 93, 41] : [217, 130, 83];

        if (animate) {
            let startTime = performance.now();
            let initial_c0 = [...c0];
            let initial_cPos = [...cPos];
            let initial_cNeg = [...cNeg];
            let initial_pecFill = [...pecFill_rgb];
            let initial_pecStroke = [...pecStroke_rgb];

            function lerpColor(now) {
                let t = Math.min((now - startTime) / 2000, 1);
                let easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                for(let i=0; i<3; i++) {
                    c0[i] = initial_c0[i] + (target_c0[i] - initial_c0[i]) * easeT;
                    cPos[i] = initial_cPos[i] + (target_cPos[i] - initial_cPos[i]) * easeT;
                    cNeg[i] = initial_cNeg[i] + (target_cNeg[i] - initial_cNeg[i]) * easeT;
                    pecFill_rgb[i] = initial_pecFill[i] + (target_pecFill[i] - initial_pecFill[i]) * easeT;
                    pecStroke_rgb[i] = initial_pecStroke[i] + (target_pecStroke[i] - initial_pecStroke[i]) * easeT;
                }

                pecFill = `rgb(${Math.round(pecFill_rgb[0])}, ${Math.round(pecFill_rgb[1])}, ${Math.round(pecFill_rgb[2])})`;
                pecStroke = `rgb(${Math.round(pecStroke_rgb[0])}, ${Math.round(pecStroke_rgb[1])}, ${Math.round(pecStroke_rgb[2])})`;

                if (isPaused) render();

                if (t < 1) {
                    requestAnimationFrame(lerpColor);
                } else {
                    document.documentElement.classList.remove('theme-transition');
                }
            }
            requestAnimationFrame(lerpColor);
        } else {
            c0 = target_c0;
            cPos = target_cPos;
            cNeg = target_cNeg;
            pecFill_rgb = target_pecFill;
            pecStroke_rgb = target_pecStroke;

            pecFill = `rgb(${pecFill_rgb[0]}, ${pecFill_rgb[1]}, ${pecFill_rgb[2]})`;
            pecStroke = `rgb(${pecStroke_rgb[0]}, ${pecStroke_rgb[1]}, ${pecStroke_rgb[2]})`;
            if (isPaused) render();
        }
    }

    function updateObjectMask(rotationDeg) {
        mask.fill(0);
        const theta = rotationDeg * Math.PI / 180;
        const cx_coord = 100, cy_coord = 100;

        const basePoly = [
            {x: 0, y: 25},
            {x: 10, y: 12},
            {x: 10, y: -25},
            {x: -10, y: -25},
            {x: -10, y: 12}
        ];

        currentPoly = basePoly.map(p => ({
            x: cx_coord + p.x * Math.cos(theta) - p.y * Math.sin(theta),
            y: cy_coord + p.x * Math.sin(theta) + p.y * Math.cos(theta)
        }));

        for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
                let inside = false;
                for (let k = 0, l = currentPoly.length - 1; k < currentPoly.length; l = k++) {
                    let xi = currentPoly[k].x, yi = currentPoly[k].y;
                    let xj = currentPoly[l].x, yj = currentPoly[l].y;
                    let intersect = ((yi > j) != (yj > j)) && (i < (xj - xi) * (j - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                if (inside) mask[i + j * N] = 1;
            }
        }
    }

    function handleWheelScroll(e, element, callback, multiplier = 1) {
        e.preventDefault();
        if (element.disabled) return;

        const step = (parseFloat(element.step) || 1) * multiplier;
        const direction = e.deltaY < 0 ? 1 : -1;

        let newValue = parseFloat(element.value) + (direction * step);
        newValue = Math.max(parseFloat(element.min), Math.min(parseFloat(element.max), newValue));

        element.value = newValue;
        callback({ target: element });
    }

    rotSlider.addEventListener('input', (e) => {
        document.getElementById('rotVal').innerText = e.target.value + '°';
        updateObjectMask(parseFloat(e.target.value));
        if (isPaused) render();
    });

    rotSlider.addEventListener('wheel', (e) => {
        handleWheelScroll(e, rotSlider, (ev) => {
            document.getElementById('rotVal').innerText = ev.target.value + '°';
            updateObjectMask(parseFloat(ev.target.value));
            if (isPaused) render();
        }, 3);
    });

    speedSlider.addEventListener('input', (e) => {
        simSpeed = parseFloat(e.target.value);
        document.getElementById('speedVal').innerText = simSpeed + 'x';
    });

    speedSlider.addEventListener('wheel', (e) => {
        handleWheelScroll(e, speedSlider, (ev) => {
            simSpeed = parseFloat(ev.target.value);
            document.getElementById('speedVal').innerText = simSpeed + 'x';
        }, 1);
    });

    fieldSelect.addEventListener('change', (e) => {
        renderMode = e.target.value;
        if (isPaused) render();
    });

    playPauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        playPauseBtn.textContent = isPaused ? 'Play' : 'Pause';
        playPauseBtn.classList.toggle('paused', isPaused);

        fieldSelect.disabled = isPaused;
        speedSlider.disabled = isPaused;
        rotSlider.disabled = isPaused;
    });

    updateObjectMask(45);
    const imgData = ctx.createImageData(N, N);

    function step() {
        for (let j = 0; j < N - 1; j++) {
            for (let i = 0; i < N - 1; i++) {
                let idx = i + j * N;
                let idx_x = (i + 1) + j * N;
                let idx_y = i + (j + 1) * N;

                let dEz_y = Ez[idx_y] - Ez[idx];
                psi_Hx_y[idx] = byh[j] * psi_Hx_y[idx] + cyh[j] * dEz_y;
                Hx[idx] -= v * (dEz_y + psi_Hx_y[idx]);

                let dEz_x = Ez[idx_x] - Ez[idx];
                psi_Hy_x[idx] = bxh[i] * psi_Hy_x[idx] + cxh[i] * dEz_x;
                Hy[idx] += v * (dEz_x + psi_Hy_x[idx]);

                let dEz2_y = Ez2[idx_y] - Ez2[idx];
                psi_Hx2_y[idx] = byh[j] * psi_Hx2_y[idx] + cyh[j] * dEz2_y;
                Hx2[idx] -= v * (dEz2_y + psi_Hx2_y[idx]);

                let dEz2_x = Ez2[idx_x] - Ez2[idx];
                psi_Hy2_x[idx] = bxh[i] * psi_Hy2_x[idx] + cxh[i] * dEz2_x;
                Hy2[idx] += v * (dEz2_x + psi_Hy2_x[idx]);
            }
        }

        for (let j = 1; j < N; j++) {
            for (let i = 1; i < N; i++) {
                let idx = i + j * N;
                let idx_x = (i - 1) + j * N;
                let idx_y = i + (j - 1) * N;

                let dHy_x = Hy[idx] - Hy[idx_x];
                let dHx_y = Hx[idx] - Hx[idx_y];

                psi_Ez_x[idx] = bx[i] * psi_Ez_x[idx] + cx[i] * dHy_x;
                psi_Ez_y[idx] = by[j] * psi_Ez_y[idx] + cy[j] * dHx_y;

                Ez[idx] += v * (dHy_x + psi_Ez_x[idx] - dHx_y - psi_Ez_y[idx]);

                let dHy2_x = Hy2[idx] - Hy2[idx_x];
                let dHx2_y = Hx2[idx] - Hx2[idx_y];

                psi_Ez2_x[idx] = bx[i] * psi_Ez2_x[idx] + cx[i] * dHy2_x;
                psi_Ez2_y[idx] = by[j] * psi_Ez2_y[idx] + cy[j] * dHx2_y;

                Ez2[idx] += v * (dHy2_x + psi_Ez2_x[idx] - dHx2_y - psi_Ez2_y[idx]);
            }
        }

        const src_val = 1.0 * Math.sin(omega * time);
        for (let j = 1; j < N - 1; j++) {
            let idx = 32 + j * N;
            Ez[idx] += src_val;
            Ez2[idx] += src_val;
        }

        for (let idx = 0; idx < numCells; idx++) {
            if (mask[idx]) Ez[idx] = 0;
        }

        time++;
    }

    function render() {
        const data = imgData.data;
        for (let i = 0; i < N; i++) {
            for (let j = 0; j < N; j++) {
                let idx = i + j * N;
                let screen_y = N - 1 - j;
                let px = (i + screen_y * N) * 4;

                let val = renderMode === 'scattered' ? (Ez[idx] - Ez2[idx]) : Ez[idx];

                if (val > 0) {
                    let t = Math.min(1, val / amplitudeMax);
                    data[px] = c0[0] + (cPos[0] - c0[0]) * t;
                    data[px+1] = c0[1] + (cPos[1] - c0[1]) * t;
                    data[px+2] = c0[2] + (cPos[2] - c0[2]) * t;
                } else {
                    let t = Math.min(1, -val / amplitudeMax);
                    data[px] = c0[0] + (cNeg[0] - c0[0]) * t;
                    data[px+1] = c0[1] + (cNeg[1] - c0[1]) * t;
                    data[px+2] = c0[2] + (cNeg[2] - c0[2]) * t;
                }
                data[px+3] = 255;
            }
        }

        ctx.putImageData(imgData, 0, 0);

        ctx.beginPath();
        for (let k = 0; k < currentPoly.length; k++) {
            let px = currentPoly[k].x;
            let py = N - 1 - currentPoly[k].y;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();

        ctx.fillStyle = pecFill;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = pecStroke;
        ctx.stroke();
    }

    for(let i = 0; i < 75; i++) {
        step();
    }
    render();

    function animate() {
        if (!isPaused) {
            stepAccumulator += simSpeed;
            let stepsToTake = Math.floor(stepAccumulator);
            stepAccumulator -= stepsToTake;

            for (let s = 0; s < stepsToTake; s++) {
                step();
            }
            if (stepsToTake > 0) {
                render();
            }
        }
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
